  /stock-counts/history:
    get:
      operationId: StockCountController_findHistory
      parameters:
        - *a8
        - name: page
          required: false
          in: query
          description: Page number (1-indexed)
          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            default: 20
            example: 20
            type: number
        - name: offset
          required: false
          in: query
          description: Offset for cursor queries
          schema:
            default: 0
            example: 0
            type: number
        - name: search
          required: false
