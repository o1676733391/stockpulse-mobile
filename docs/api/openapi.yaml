      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStockCountSessionDto"
      responses:
        "201":
          description: Stock count session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCountSessionResponseDto"
      security: &a9
        - BearerAuth: []
      summary: Instantiate a new stocktaking audit session
      tags: &a10
        - Stock Counts
  /stock-counts/sessions/{sessionId}/items/{itemId}:
    put:
      operationId: StockCountController_recordItemCount
      parameters:
        - *a8
        - name: sessionId
          required: true
          in: path
          description: Stock count session UUID
          schema:
            type: string
        - name: itemId
          required: true
          in: path
          description: Inventory item UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCountItemDto"
      responses:
        "200":
          description: Counted quantity recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCountItemResponseDto"
      security: *a9
      summary: Record counted quantity for SKU in active session
      tags: *a10
  /stock-counts/sessions/{sessionId}/items:
    post:
      operationId: StockCountController_bulkRecordItemCounts
