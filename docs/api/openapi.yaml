info:
  title: StockPulse SaaS API
  description: >
    ## Multi-Tenant F&B Inventory & Intelligence Platform API


    StockPulse provides unified backend capabilities for restaurant and cloud
    kitchen inventory intelligence, FEFO lot management, Document AI & Gemini
    Vision OCR processing, and finite-state procurement workflows.


    ### Universal Request Protocols

    - **Authentication**: Bearer JWT token issued by Supabase Auth
    (`Authorization: Bearer <token>`).

    - **Multi-Tenancy Context**: Store location context must be passed via the
    `X-Store-Id` header.

    - **Idempotency**: Critical mutations support `Idempotency-Key` header for
    replay protection.

    - **Concurrency**: Optimistic locking supported via version tags.
  version: 1.0.0
  contact: {}
tags:
  - name: Authentication
    description: Authentication, Tenant Registration, Store Switching, and Supabase Webhooks
  - name: Inventory
    description: Master catalog, stock balances, FEFO batch tracking, and manual adjustments
  - name: Stock Counts
    description: Blind & standard count sessions, shrinkage calculation, and
      variance ledger sync
  - name: OCR
    description: Google Gemini Multimodal Vision & Document AI OCR, review workflow,
      and BOM deductions
  - name: Procurement
    description: Purchase Orders (Draft/Submit/Approve/Receive/Cancel) and Goods Receipts
  - name: Suppliers
    description: Supplier master directory, payment terms, and lead time tracking
  - name: Notifications
    description: In-app notifications, device push tokens, and notification preferences
  - name: Audit
    description: Cryptographic WORM audit logging, SHA-256 hash chaining, and ledger
      integrity verification
servers: []
components:
  securitySchemes:
    BearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: JWT
      description: Enter Supabase JWT Access Token
      in: header
    StoreIdHeader:
      type: apiKey
      in: header
      name: X-Store-Id
      description: Active store tenant UUID context
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: mario@stockpulse.app
          description: User account email address
        password:
          type: string
          example: Secret123!
          description: User password (min 6 characters)
      required:
        - email
        - password
    AuthUserSummaryDto:
      type: object
      properties:
        id:
          type: string
          example: 01915dfa-b1c4-7221-9988-51b72e04e001
        email:
          type: string
          example: mario@stockpulse.app
        name:
          type: string
          example: Mario Batali
        role:
          type: string
          example: manager
          enum:
            - superadmin
            - manager
            - supervisor
            - staff
            - auditor
        organizationId:
          type: string
          example: 01915dfa-9012-7000-8000-000000000001
        organizationName:
          type: string
          example: StockPulse Demo Cafe Group
        defaultStoreId:
          type: string
          example: 01915dfa-9012-7000-8000-000000000002
        assignedStoreIds:
          example:
            - 01915dfa-9012-7000-8000-000000000002
            - 01915dfa-9012-7000-8000-000000000003
          type: array
          items:
            type: string
        permissions:
          example:
            - inventory:view
            - inventory:create
            - inventory:update
            - inventory:adjust
            - procurement:create
            - procurement:approve
            - ocr:upload
            - ocr:confirm
          type: array
          items:
            type: string
      required:
        - id
        - email
        - name
        - role
        - organizationId
        - assignedStoreIds
        - permissions
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Supabase JWT access token for Bearer authentication
        refreshToken:
          type: string
          example: v1.refresh-token-abc123xyz...
          description: Refresh token to renew expired access tokens
        expiresIn:
          type: number
          example: 3600
          description: Token lifespan in seconds
        tokenType:
          type: string
          example: Bearer
          description: Token authorization type
        user:
          description: Authenticated user profile and permissions
          allOf:
            - $ref: "#/components/schemas/AuthUserSummaryDto"
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
        - user
    SignupDto:
      type: object
      properties:
        email:
          type: string
          example: chef@restaurant.com
          description: Tenant owner email
        password:
          type: string
          example: StrongPassword123!
          description: Secure password (min 8 characters)
        name:
          type: string
          example: Gordon Ramsay
          description: Full name of tenant administrator
        organizationName:
          type: string
          example: Union Street Cafe Group
          description: Name of the business organization
        organizationSlug:
          type: string
          example: union-street-cafe
          description: Unique organization subdomain / slug
        phone:
          type: string
          example: +1 555-0144
          description: Contact phone number
      required:
        - email
        - password
        - name
