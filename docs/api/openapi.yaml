      operationId: StockCountController_getVarianceSummary
      parameters:
        - *a8
        - name: sessionId
          required: true
          in: path
          description: Stock count session UUID
          schema:
            type: string
      responses:
        "200":
          description: Variance analysis and shrinkage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VarianceReviewResponseDto"
      security: *a9
      summary: Get variance breakdown for count session
