            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCountSessionDto"
      responses:
        "200":
          description: Count submitted and variance calculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VarianceReviewResponseDto"
      security: *a9
      summary: Submit count session and trigger algorithmic variance calculation
      tags: *a10
  /stock-counts/sessions/{sessionId}/variance:
