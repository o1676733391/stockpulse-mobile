openapi: 3.0.0
paths:
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponseDto"
        "401":
          description: Invalid credentials
      summary: Authenticate user and issue JWT access/refresh token pair
      tags: &a1
        - Authentication
  /auth/signup:
    post:
      operationId: AuthController_signup
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupDto"
      responses:
        "201":
          description: Registration and workspace initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponseDto"
        "400":
          description: Validation error or email already exists
      summary: Register new tenant organization and superadmin owner account
      tags: *a1
  /auth/refresh:
    post:
      operationId: AuthController_refreshToken
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "200":
          description: Tokens rotated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponseDto"
        "401":
          description: Invalid or expired refresh token
      summary: Rotate refresh token and issue fresh JWT session
      tags: *a1
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Session terminated
      security:
        - BearerAuth: []
      summary: Revoke active session token
      tags: *a1
  /auth/me:
    get:
      operationId: AuthController_getProfile
      parameters: []
      responses:
        "200":
          description: Authenticated user profile
      security:
        - BearerAuth: []
      summary: Get current authenticated user profile, permissions, and store access
      tags: *a1
  /auth/switch-store:
    post:
      operationId: AuthController_switchStore
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchStoreDto"
      responses:
        "200":
          description: Switched store context successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponseDto"
      security:
        - BearerAuth: []
      summary: Switch active store context for multi-store supervisors/managers
      tags: *a1
  /auth/webhook:
    post:
      operationId: AuthController_handleWebhook
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUserWebhookDto"
      responses:
        "200":
          description: Webhook event processed
      summary: Supabase Auth Webhook receiver for automatic user synchronization
      tags: *a1
  /users/me:
    get:
      operationId: UsersController_getMe
      parameters: []
      responses:
        "200":
          description: ""
      summary: Get profile of authenticated user
      tags: &a2
        - Users
  /users/{id}:
    get:
      operationId: UsersController_findById
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Get user by ID
      tags: *a2
    patch:
      operationId: UsersController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDto"
      responses:
        "200":
          description: ""
      summary: Update user profile and store assignments
      tags: *a2
    delete:
      operationId: UsersController_delete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Deactivate / Delete user
      tags: *a2
  /users:
    post:
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserDto"
      responses:
        "201":
          description: ""
      summary: Create a new team member
      tags: *a2
  /organizations/{id}:
    get:
      operationId: OrganizationsController_findById
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Get organization details and subscription status
      tags: &a3
        - Organizations
    patch:
      operationId: OrganizationsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationDto"
      responses:
        "200":
          description: ""
      summary: Update organization details
      tags: *a3
  /organizations:
    post:
      operationId: OrganizationsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationDto"
      responses:
        "201":
          description: ""
      summary: Create new organization tenant
      tags: *a3
  /stores/{id}:
    get:
      operationId: StoresController_findById
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Get store location details
      tags: &a4
        - Stores
    patch:
      operationId: StoresController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreDto"
      responses:
        "200":
          description: ""
      summary: Update store location settings
      tags: *a4
  /stores:
    post:
      operationId: StoresController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreDto"
      responses:
        "201":
          description: ""
      summary: Create new store location
      tags: *a4
  /inventory:
    get:
      operationId: InventoryController_findPaginated
      parameters:
        - &a5
          name: X-Store-Id
          in: header
          description: Active store tenant UUID context
          required: true
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number (1-indexed)
          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            default: 20
            example: 20
            type: number
        - name: offset
          required: false
          in: query
          description: Offset for cursor queries
          schema:
            default: 0
            example: 0
            type: number
        - name: search
          required: false
          in: query
          description: Search term for name/SKU/code
          schema:
            example: milk
            type: string
        - name: sortBy
          required: false
          in: query
          description: Field to sort by
          schema:
            default: createdAt
            example: created_at
            type: string
        - name: sortOrder
          required: false
          in: query
          schema:
            default: DESC
            example: DESC
            enum:
              - ASC
              - DESC
              - asc
              - desc
            type: string
        - name: categoryId
          required: false
          in: query
          description: Filter by category UUID
          schema:
            example: 01915dfa-b1c4-7221-9988-51b72e04e010
            type: string
        - name: status
          required: false
          in: query
          description: Filter by dynamic stock health status
          schema:
            example: low
            enum:
              - healthy
              - low
              - critical
              - overstock
            type: string
        - name: storageArea
          required: false
          in: query
          description: Filter by storage zone
          schema:
            example: Walk-in Chiller
            type: string
        - name: includeArchived
          required: false
          in: query
          description: Whether to include soft-deleted/archived items
          schema:
            default: false
            example: false
            type: boolean
      responses:
        "200":
          description: Paginated list of inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponseDto"
      security: &a6
        - BearerAuth: []
      summary: List paginated inventory items with filters and search
      tags: &a7
        - Inventory
    post:
      operationId: InventoryController_create
      parameters:
        - *a5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemDto"
      responses:
        "201":
          description: Inventory item created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponseDto"
        "400":
          description: Validation error
        "409":
          description: SKU code already exists in store
      security: *a6
      summary: Create a new inventory SKU definition in the store
      tags: *a7
  /inventory/{id}:
    get:
      operationId: InventoryController_findById
      parameters:
        - *a5
        - name: id
          required: true
          in: path
          description: Inventory item UUID
          schema:
            type: string
      responses:
        "200":
          description: Inventory item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemDetailResponseDto"
        "404":
          description: Inventory item not found
      security: *a6
      summary: Get comprehensive inventory item details including FEFO batches
      tags: *a7
    patch:
      operationId: InventoryController_update
      parameters:
        - *a5
        - name: id
          required: true
          in: path
          description: Inventory item UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryItemDto"
      responses:
        "200":
          description: Inventory item updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponseDto"
        "404":
          description: Inventory item not found
        "409":
          description: Optimistic locking conflict
      security: *a6
      summary: Update existing inventory item master attributes with optimistic locking
      tags: *a7
    delete:
      operationId: InventoryController_archive
      parameters:
        - *a5
        - name: id
          required: true
          in: path
          description: Inventory item UUID
          schema:
            type: string
      responses:
        "200":
          description: Inventory item archived successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveItemResponseDto"
        "404":
          description: Inventory item not found
      security: *a6
      summary: Archive (soft-delete) an inventory SKU
      tags: *a7
  /inventory/{id}/adjustments:
    post:
      operationId: InventoryController_adjustStock
      parameters:
        - *a5
        - name: id
          required: true
          in: path
          description: Inventory item UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockAdjustmentDto"
      responses:
        "201":
          description: Stock adjustment applied and recorded in ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAdjustmentResponseDto"
        "400":
          description: Adjustment would result in negative balance
        "404":
          description: Inventory item not found
      security: *a6
      summary: Execute manual stock adjustment with ledger sync
      tags: *a7
  /stock-counts/sessions:
    post:
      operationId: StockCountController_startSession
      parameters:
        - &a8
          name: X-Store-Id
          in: header
          description: Active store tenant UUID context
