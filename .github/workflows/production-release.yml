name: Production Build & Release (TestFlight)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target mobile platform'
        required: true
        type: choice
        options:
          - ios
          - android
          - all
        default: ios
      profile:
        description: 'EAS build profile (configured in eas.json)'
        required: true
        type: choice
        options:
          - 'production:local'
          - 'production'
          - 'preview'
        default: 'production:local'
      auto_submit:
        description: 'Automatically submit to TestFlight / App Store Connect'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Production Quality & Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Run i18n Parity & Unit Tests
        run: npm run test:i18n

  build-mobile:
    name: Build & Submit via EAS
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore Local Build & Submit Credentials (if secret provided)
        env:
          CREDENTIALS_BUNDLE_BASE64: ${{ secrets.CREDENTIALS_BUNDLE_BASE64 }}
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p docs/certificates

          if [ -n "$CREDENTIALS_BUNDLE_BASE64" ]; then
            echo "Unpacking credentials bundle from CREDENTIALS_BUNDLE_BASE64..."
            echo "$CREDENTIALS_BUNDLE_BASE64" | base64 --decode | tar -xzf -
            echo "Bundle unpacked successfully."
          fi

          if [ -n "$CREDENTIALS_JSON" ]; then
            echo "$CREDENTIALS_JSON" > credentials.json
          fi

          if [ -n "$ASC_API_KEY_P8" ]; then
            echo "$ASC_API_KEY_P8" > docs/certificates/AuthKey_NC23V7MVKY.p8
          fi

          if [ -n "$IOS_DIST_CERT_P12_BASE64" ]; then
            echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > docs/certificates/Zertifikate.p12
          fi

          if [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > docs/certificates/stockpulsetf.mobileprovision
          fi

      - name: Trigger EAS Build
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'ios' }}"
          PROFILE="${{ github.event.inputs.profile || 'production:local' }}"
          AUTO_SUBMIT="${{ github.event.inputs.auto_submit || (github.event_name == 'push') }}"

          EXTRA_FLAGS=""
          if [ "$AUTO_SUBMIT" = "true" ]; then
            EXTRA_FLAGS="--auto-submit"
          fi

          echo "Starting EAS Build for platform: $PLATFORM with profile: $PROFILE (Auto-submit: $AUTO_SUBMIT)"
          npx eas-cli build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive $EXTRA_FLAGS
